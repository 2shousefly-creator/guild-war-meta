<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Guild War Meta — Major League 3v3 · Seven Knights: Re:BIRTH</title>

<style>
:root{
  color-scheme: light dark;
  --bg:#eceef2; --bg2:#e2e5ec; --surface:#ffffff; --surface2:#f4f5f8; --line:#d5d9e2;
  --ink:#181c26; --ink2:#4c5468; --ink3:#7c8499;
  --gold:#a8740a; --gold-bg:#fdf3d7; --gold-line:#e5c76a;
  --danger:#b3352c; --danger-bg:#fbe9e7;
  --physical:#c2501e; --magic:#3366b8; --tank:#2e7d52; --death:#9c3d5e; --status:#9a7208; --special:#1f7a74;
  --chip:#eef0f4;
  --front:#FF6A3D; --back:#3DA9FC;
  --front-frame:var(--front); --back-frame:var(--back);
  --shadow:0 10px 30px rgba(20,24,40,.14);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0f16; --bg2:#0c0f16; --surface:#161b27; --surface2:#1d2434; --line:#2b3347;
    --ink:#eef0f6; --ink2:#aab3c5; --ink3:#79839a;
    --gold:#e7bc4f; --gold-bg:#2c2410; --gold-line:#6d5a1e;
    --danger:#ff8a7a; --danger-bg:#331714;
    --physical:#ff8a5c; --magic:#7aa5e8; --tank:#5fc78d; --death:#e07b9c; --status:#eec44f; --special:#4fd1c5;
    --chip:#1d2434;
    --shadow:0 14px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.55}
img{display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}

/* ---------- header ---------- */
header.top{padding:28px 0 6px}
.eyebrow{font-family:"Be Vietnam Pro",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700}
h1{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:6px 0 8px;font-weight:900}
h1 .thin{font-weight:600;color:var(--ink2)}
.sub{color:var(--ink2);max-width:720px;margin:0 0 14px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.pill b{color:var(--ink)}
.pill.warn{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.pill.goldp{background:var(--gold-bg);border-color:var(--gold-line);color:var(--ink)}
.fanpage-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.fp-src{color:var(--ink2);font-size:13.5px}
.fp-src b{color:var(--ink)}
.fp-btn{display:inline-flex;align-items:center;gap:8px;background:#1877f2;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:13.5px;transition:background .15s}
.fp-btn:hover{background:#0f65d8}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;min-width:130px}
.stat .n{font-family:"Be Vietnam Pro",sans-serif;font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--ink2);font-weight:600}

/* ---------- toolbar ---------- */
.searchbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:12px 0 10px;margin-top:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search svg{flex:none;color:var(--ink3)}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;width:100%}
.search input::placeholder{color:var(--ink3)}
.search .clear{border:0;background:var(--chip);color:var(--ink2);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;display:none}
.search-wrap{position:relative}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:45;display:none;max-height:344px;overflow-y:auto}
.suggest.open{display:block;animation:fadeIn .15s ease}
.sg-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:none;border:0;text-align:left;color:var(--ink);font:inherit}
.sg-item + .sg-item{border-top:1px solid var(--surface2)}
.sg-item img{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.sg-item .sg-name{font-weight:700;font-size:14px}
.sg-item .cnt{margin-left:auto;color:var(--ink3);font-size:12px;font-weight:700;white-space:nowrap}
.sg-item.active,.sg-item:hover{background:var(--surface2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 2px 4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.tab .cnt{font-size:11.5px;background:var(--chip);border-radius:999px;padding:1px 8px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .cnt{background:rgba(127,127,127,.25);color:inherit}
.tab .dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- group sections / cards ---------- */
.group-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px}
.group-head h2{font-size:22px;margin:0;font-weight:800}
.group-head .gcount{color:var(--ink3);font-weight:700;font-size:13px}
.group-head .grule{flex:1;height:1px;background:var(--line);align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;width:100%;color:var(--ink);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.code{font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:19px;letter-spacing:.04em;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px}
.gtag{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.card-top .arr{margin-left:auto;color:var(--ink3);font-weight:700;font-size:13px}
.heroes{display:flex;gap:10px}
.hero{flex:1;min-width:0;text-align:center}
.hero img{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1px solid var(--line);object-fit:cover}
.hero .hn{font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:5px;line-height:1.3;overflow-wrap:anywhere}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);flex-wrap:wrap}
.fmt{font-size:12.5px;font-weight:700;background:var(--chip);border-radius:8px;padding:4px 9px}
.fmt-sq{display:inline-flex;gap:5px;vertical-align:middle;background:var(--chip);border-radius:8px;padding:5px 8px}
.formation-box .fmt-sq{background:var(--surface2)}
.fsq-col{display:flex;flex-direction:column;gap:2px}
.fsq{width:10px;height:10px;border-radius:3px;flex:none}
.fsq.b{background:var(--back)}
.fsq.f{background:var(--front)}
.fsq.off{background:transparent;opacity:.45}
.fsq.off.b{border:1.5px solid var(--back)}
.fsq.off.f{border:1.5px solid var(--front)}
.fsq.gap{background:transparent;border:1.5px solid transparent;opacity:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.petmini{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.petmini img{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface2)}
.ccount{margin-left:auto;font-size:12.5px;color:var(--gold);font-weight:800}
.empty{display:none;text-align:center;color:var(--ink2);padding:44px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);margin-top:16px}
.empty.show{display:block}

/* ---------- detail overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.62);z-index:60;display:none;overflow-y:auto;padding:18px 12px 40px}
.overlay.open{display:block}
.sheet{max-width:860px;margin:0 auto;background:var(--bg);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 18px 26px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;position:sticky;top:-1px;z-index:6;background:var(--bg);margin:-20px -18px 6px;padding:16px 18px 12px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.sheet-head h2{margin:2px 0 4px;font-size:clamp(20px,4vw,27px);line-height:1.25}
.closebtn{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:800}
.section-t{font-family:"Be Vietnam Pro",sans-serif;letter-spacing:.07em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700;margin:22px 0 8px}
.formation-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.fmt-name{font-weight:800;font-size:16px;margin-bottom:10px}
.fmt-name span{color:var(--ink2);font-weight:600;font-size:13px}
.board{position:relative;display:flex;align-items:stretch;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.bgroup{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;justify-content:center}
.bgroup.back{align-items:flex-start}
.bgroup.front{align-items:flex-end}
.bdiv{flex:none;width:2px;border-radius:2px;background:var(--ink3);opacity:.55;margin:0 10px}
.bhero{position:relative;flex:none;width:116px;display:flex;align-items:flex-start}
.bhero.front{flex-direction:row-reverse}
.bcol{flex:none;width:78px;display:flex;flex-direction:column;align-items:center}
.bimg{position:relative;width:78px;height:78px;flex:none}
.bimg img{width:78px;height:78px;border-radius:10px;background:var(--surface);object-fit:cover}
.bhero.front .bimg img{border:3px solid var(--front-frame)}
.bhero.back .bimg img{border:3px solid var(--back-frame)}
.skl-tags{flex:none;width:38px;height:78px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.skl-zone{display:flex;flex-direction:column;gap:3px;min-height:19px}
.bhero.back .skl-tags{padding-right:4px}
.bhero.back .skl-zone{align-items:flex-end}
.bhero.front .skl-tags{padding-left:4px}
.bhero.front .skl-zone{align-items:flex-start}
.skl-tag{font-size:11px;font-weight:800;background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--ink);border-radius:6px;padding:1px 5px;white-space:nowrap;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bhn{font-size:11px;font-weight:600;color:var(--ink2);margin-top:5px;line-height:1.25;text-align:center;overflow-wrap:anywhere;width:100%}
.lgwrap{float:right;display:inline-flex;gap:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink2)}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.lg .lg-f{background:var(--front-frame)}
.lg .lg-b{background:var(--back-frame)}
.mini-open{margin-left:auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 11px;font-weight:800;font-size:12.5px;flex:none}
@media (max-width:560px){.bimg,.bimg img{width:66px;height:66px}.skl-tags{height:66px}.bcol{width:66px}.bhero{width:104px}.bdiv{margin:0 6px}.board{padding:10px}.bgroup{gap:10px}}
.petbox{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.petbox img{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.petbox .pn{font-weight:800;font-size:16px}
.petbox .pe{color:var(--ink2);font-size:13.5px}
.counter-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.counter-block .cb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prio{font-family:"Be Vietnam Pro",sans-serif;font-weight:800;background:var(--gold);color:#191204;border-radius:8px;padding:3px 10px;font-size:14px;letter-spacing:.03em}
@media (prefers-color-scheme: dark){.prio{color:#191204}}
.skills{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);counter-reset:sk}
.skills li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.skills li + li{border-top:1px solid var(--surface2)}
.sknum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.skill-txt{font-size:14px}
.skill-txt b{font-weight:800}
.slot{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;margin:0 4px;vertical-align:1px}
.slot.s1{background:#dcebfb;color:#144a86}
.slot.s2{background:#fbe3c8;color:#7a4a05}
@media (prefers-color-scheme: dark){.slot.s1{background:#173457;color:#9ec5f5}.slot.s2{background:#4a3208;color:#f5cd7e}}

/* ---------- info sections ---------- */
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:34px}
.info h2{margin:0 0 10px;font-size:19px}
.info h3{margin:18px 0 6px;font-size:15.5px}
.info p,.info li{color:var(--ink2);font-size:14px}
.info ul{margin:6px 0;padding-left:20px}
.info a{color:var(--gold);font-weight:600;overflow-wrap:anywhere}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.pet-card{display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pet-card img{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pet-card .pn{font-weight:800}
.pet-card .pe{font-size:12.5px;color:var(--ink2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(14px)}}
.card{animation:fadeUp .3s ease backwards}
.group-head{animation:fadeUp .3s ease backwards}
.counter-block{animation:fadeUp .38s ease backwards}
.overlay.open{animation:fadeIn .18s ease}
.overlay.open .sheet{animation:sheetIn .3s cubic-bezier(.2,.8,.25,1)}
.overlay.closing{animation:fadeOut .18s ease both}
.overlay.closing .sheet{animation:sheetOut .18s ease both}
footer{margin-top:30px;color:var(--ink3);font-size:12.5px;text-align:center}
footer .ver{display:block;margin-top:6px;font-size:10px;letter-spacing:.04em;opacity:.65}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .stat{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* Visual formation diagram: Back-slot column (left) + Front-slot column (right).
   Both columns share one row grid of max(frontCap, backCap) rows. Each column's
   slot block is vertically centered in the grid, and its filled (lit) squares
   are centered within the block — e.g. Attack (1-4) with 2 heroes in Back lights
   the two middle blue squares, and the lone Front square sits mid-height.
   Cells outside a column's block are invisible spacers (.fsq.gap). */
var TEMPLATES = {"Defense (4-1)": [4, 1], "Attack (1-4)": [1, 4], "Basic (2-3)": [2, 3], "Balanced (3-2)": [3, 2]};
function formationSquares(team){
  var name = fmtShort(team);
  var cap = TEMPLATES[name] || [team.front.length, team.back.length];
  var rows = Math.max(cap[0], cap[1]);
  function col(capN, filled, cls){
    var start = Math.floor((rows - capN) / 2);
    var fStart = start + Math.floor((capN - filled) / 2);
    var s = "";
    for (var i = 0; i < rows; i++){
      if (i < start || i >= start + capN) s += '<span class="fsq gap"></span>';
      else s += '<span class="fsq ' + cls + (i >= fStart && i < fStart + filled ? "" : " off") + '"></span>';
    }
    return '<span class="fsq-col">' + s + '</span>';
  }
  return '<span class="fmt-sq" role="img" title="' + esc(name) + '" aria-label="Đội hình ' + esc(name) + '">'
    + col(cap[1], team.back.length, "b") + col(cap[0], team.front.length, "f")
    + '<span class="sr-only">' + esc(name) + '</span></span>';
}

function matches(team, isCounter){
  if (!state.q) return true;
  var q = state.q.toLowerCase();
  var hay = (team.code + " " + team.pet + " " + team.heroes.map(function(h){return h.name;}).join(" ")).toLowerCase();
  if (isCounter) hay += " " + DATA.counters[team.code].skills.map(function(s){return (s.hero||"")+" "+(s.name||"");}).join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function render(){
  var list = document.getElementById("list");
  var html = "", any = false;
  if (state.tab === "counters"){
    var cs = Object.keys(DATA.counters).filter(function(c){ return matches(DATA.counters[c], true); });
    if (cs.length){
      any = true;
      html += '<div class="group-head"><h2>Thư viện đội hình khắc chế</h2><span class="gcount">'+cs.length+' đội hình</span><span class="grule"></span></div>'
        + '<div class="grid">' + cs.map(function(c, i){ return counterCardHTML(c, i); }).join("") + '</div>';
    }
  } else {
    GROUPS.forEach(function(g){
      if (state.tab !== "all" && state.tab !== g.id) return;
      var teams = DATA.defense.filter(function(d){ return d.group===g.id && matches(d,false); });
      if (!teams.length) return;
      any = true;
      html += '<div class="group-head"><h2 style="color:'+g.color+'">'+g.label+'</h2><span class="gcount">'+teams.length+' biến thể</span><span class="grule"></span></div>'
        + '<div class="grid">' + teams.map(function(d, i){ return cardHTML(d, i); }).join("") + '</div>';
    });
    if (state.q && state.tab === "all"){
      var cs2 = Object.keys(DATA.counters).filter(function(c){ return matches(DATA.counters[c], true); });
      if (cs2.length){
        any = true;
        html += '<div class="group-head"><h2 style="color:var(--gold)">Đội hình khắc chế</h2><span class="gcount">'+cs2.length+' đội hình có tướng này</span><span class="grule"></span></div>'
          + '<div class="grid">' + cs2.map(function(c, i){ return counterCardHTML(c, i); }).join("") + '</div>';
      }
    }
  }
  list.innerHTML = html;
  document.getElementById("empty").className = "empty" + (any ? "" : " show");
  list.querySelectorAll("[data-team]").forEach(function(b){ b.addEventListener("click", function(){ openTeam(b.getAttribute("data-team")); }); });
  list.querySelectorAll("[data-counter]").forEach(function(b){ b.addEventListener("click", function(){ openCounter(b.getAttribute("data-counter")); }); });
}

function skillTags(v){
  var tags = {};
  (v.skills || defSkills(v) || []).forEach(function(s, i){ if (s.hero) (tags[s.hero] = tags[s.hero] || []).push({n: i + 1, slot: s.slot}); });
  return tags;
}
function boardHeroHTML(h, tags, side){
  var list = (tags && tags[h.name]) || [];
  var top = list.filter(function(t){ return t.slot === "Skill 1"; });
  var bot = list.filter(function(t){ return t.slot !== "Skill 1"; });
  function zone(arr){ return '<span class="skl-zone">' + arr.map(function(t){ return '<span class="skl-tag">⚔️' + t.n + '</span>'; }).join("") + '</span>'; }
  var t = '<span class="skl-tags">' + zone(top) + zone(bot) + '</span>';
  return '<div class="bhero ' + side + '">' + t + '<span class="bcol"><span class="bimg"><img src="' + heroImg(h) + '" alt="' + esc(h.name) + '" /></span><span class="bhn">' + esc(h.name) + '</span></span></div>';
}
function formationBoardHTML(team, withTags){
  var byName = {}; team.heroes.forEach(function(h){ byName[h.name] = h; });
  var tags = withTags ? skillTags(team) : null;
  function grp(names, side){ return names.map(function(n){ var h = byName[n]; return h ? boardHeroHTML(h, tags, side) : ""; }).join(""); }
  return '<div class="formation-box"><div class="fmt-name">' + formationSquares(team)
    + '<span class="lgwrap"><span class="lg"><i class="lg-f"></i>Front</span><span class="lg"><i class="lg-b"></i>Back</span></span></div>'
    + '<div class="board">'
    + '<div class="bgroup back">' + grp(team.back, "back") + '</div>'
    + '<div class="bdiv"></div>'
    + '<div class="bgroup front">' + grp(team.front, "front") + '</div>'
    + '</div></div>';
}

function openSheet(html){
  document.getElementById("sheet").innerHTML = html;
  var ov = document.getElementById("overlay");
  ov.classList.remove("closing");
  ov.classList.add("open"); ov.scrollTop = 0;
  document.body.style.overflow = "hidden";
  var cb = document.getElementById("closebtn");
  if (cb) cb.addEventListener("click", closeSheet);
  document.querySelectorAll("#sheet [data-team]").forEach(function(b){ b.addEventListener("click", function(){ openTeam(b.getAttribute("data-team")); }); });
  document.querySelectorAll("#sheet [data-counter-open]").forEach(function(b){ b.addEventListener("click", function(){ openCounter(b.getAttribute("data-counter-open")); }); });
}
function closeSheet(){
  var ov = document.getElementById("overlay");
  if (!ov.classList.contains("open") || ov.classList.contains("closing")) return;
  ov.classList.add("closing");
  document.body.style.overflow = "";
  setTimeout(function(){ ov.classList.remove("open"); ov.classList.remove("closing"); }, 180);
}
function openTeam(code){
  var d = null;

var HEROES = (function(){
  var m = {};
  function add(h, kind){ var e = m[h.name] || (m[h.name] = {name: h.name, img: h.img, def: 0, ctr: 0}); e[kind]++; }
  DATA.defense.forEach(function(d){ d.heroes.forEach(function(h){ add(h, "def"); }); });
  Object.keys(DATA.counters).forEach(function(c){ DATA.counters[c].heroes.forEach(function(h){ add(h, "ctr"); }); });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return a.name.localeCompare(b.name); });
})();
var qInput = document.getElementById("q");
var sgBox = document.getElementById("suggest");
var sgIndex = -1;
function hideSuggest(){ sgBox.classList.remove("open"); sgBox.innerHTML = ""; sgIndex = -1; }
function showSuggest(){
  var q = qInput.value.trim().toLowerCase();
  if (!q){ hideSuggest(); return; }
  var items = HEROES.filter(function(h){ return h.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
  if (!items.length){ hideSuggest(); return; }
  sgIndex = -1;
  sgBox.innerHTML = items.map(function(h){
    return '<button type="button" class="sg-item" role="option" data-hero="' + esc(h.name) + '"><img src="' + heroImg(h) + '" alt="" /><span class="sg-name">' + esc(h.name) + '</span><span class="cnt">' + h.def + ' thủ · ' + h.ctr + ' khắc chế</span></button>';
  }).join("");
  sgBox.classList.add("open");
  sgBox.querySelectorAll(".sg-item").forEach(function(b){
    b.addEventListener("mousedown", function(e){ e.preventDefault(); pickHero(b.getAttribute("data-hero")); });
  });
}
function setTabAll(){
  state.tab = "all";
  document.querySelectorAll("#tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x.getAttribute("data-tab") === "all" ? "true" : "false"); });
}
function pickHero(name){
  qInput.value = name; state.q = name;
  document.getElementById("qclear").style.display = "block";
  setTabAll(); hideSuggest(); render();
}
qInput.addEventListener("input", function(){
  state.q = qInput.value.trim();
  document.getElementById("qclear").style.display = state.q ? "block" : "none";
  render();
  showSuggest();
});
qInput.addEventListener("focus", showSuggest);
qInput.addEventListener("blur", function(){ setTimeout(hideSuggest, 120); });
qInput.addEventListener("keydown", function(e){
  var items = sgBox.querySelectorAll(".sg-item");
  if (!sgBox.classList.contains("open") || !items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    sgIndex = e.key === "ArrowDown" ? Math.min(sgIndex + 1, items.length - 1) : Math.max(sgIndex - 1, 0);
    items.forEach(function(it, i){ it.classList.toggle("active", i === sgIndex); });
  } else if (e.key === "Enter" && sgIndex >= 0 && items[sgIndex]){
    e.preventDefault(); pickHero(items[sgIndex].getAttribute("data-hero"));
  } else if (e.key === "Escape"){
    hideSuggest();
  }
});
document.getElementById("qclear").addEventListener("click", function(){
  qInput.value = ""; state.q = ""; this.style.display = "none"; hideSuggest(); render(); qInput.focus();
});

/* overlay close */
document.getElementById("overlay").addEventListener("click", function(e){ if (e.target === this) closeSheet(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

render();
</script>
</body>
</html>
