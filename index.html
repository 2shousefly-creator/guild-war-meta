<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="page-version" content="v2026.10.27-15" />
<link rel="icon" href="data:," />
<title>Guild War Meta — Major League 3v3 · Seven Knights: Re:BIRTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme: light dark;
  --bg:#eceef2; --bg2:#e2e5ec; --surface:#ffffff; --surface2:#f4f5f8; --line:#d5d9e2;
  --ink:#181c26; --ink2:#4c5468; --ink3:#7c8499;
  --gold:#a8740a; --gold-bg:#fdf3d7; --gold-line:#e5c76a;
  --danger:#b3352c; --danger-bg:#fbe9e7;
  --physical:#c2501e; --magic:#3366b8; --tank:#2e7d52; --death:#9c3d5e; --status:#9a7208; --special:#1f7a74;
  --chip:#eef0f4;
  --prop-bg:#fdf3d7; --prop-ink:#7a5200; --prop-line:#a8740a;
  --front:#FF6A3D; --back:#3DA9FC;
  --fx-damage:#D92D20; --fx-heal:#039855; --fx-buff:#175CD3; --fx-debuff:#DC6803; --fx-protection:#6941C6; --fx-control:#C11574; --fx-special:#B54708;
  --front-frame:var(--front); --back-frame:var(--back);
  --ally-bg:#e2effc; --ally-bg2:#cfe4fa; --ally-line:#6ea9e8; --ally-ink:#144a86;
  --enemy-bg:#fdecea; --enemy-bg2:#fadedb; --enemy-line:#e79a92; --enemy-ink:#8c2b21;
  --shadow:0 10px 30px rgba(20,24,40,.14);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0f16; --bg2:#0c0f16; --surface:#161b27; --surface2:#1d2434; --line:#2b3347;
    --ink:#eef0f6; --ink2:#aab3c5; --ink3:#79839a;
    --gold:#e7bc4f; --gold-bg:#2c2410; --gold-line:#6d5a1e;
    --danger:#ff8a7a; --danger-bg:#331714;
    --physical:#ff8a5c; --magic:#7aa5e8; --tank:#5fc78d; --death:#e07b9c; --status:#eec44f; --special:#4fd1c5;
    --chip:#1d2434;
    --prop-bg:#2c2410; --prop-ink:#e7bc4f; --prop-line:#e7bc4f;
    --fx-damage:#F97066; --fx-heal:#32D583; --fx-buff:#84ADFF; --fx-debuff:#FDB022; --fx-protection:#B692F6; --fx-control:#F670C7; --fx-special:#FEC84B;
    --ally-bg:#152a44; --ally-bg2:#1b3658; --ally-line:#2f5b8f; --ally-ink:#9ec5f5;
    --enemy-bg:#38201d; --enemy-bg2:#452723; --enemy-line:#7c4038; --enemy-ink:#f0a49c;
    --shadow:0 14px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:12.8px;line-height:1.55}
img{display:block}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}

/* ---------- header ---------- */
header.top{padding:28px 0 6px}
.eyebrow{font-family:"Be Vietnam Pro",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700}
h1{font-size:clamp(23.8px,5vw,35.7px);line-height:1.12;margin:6px 0 8px;font-weight:900}
h1 .thin{font-weight:600;color:var(--ink2)}
.sub{color:var(--ink2);max-width:720px;margin:0 0 14px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:10.6px;font-weight:600;color:var(--ink2)}
.pill b{color:var(--ink)}
.pill.warn{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.pill.goldp{background:var(--gold-bg);border-color:var(--gold-line);color:var(--ink)}
.fanpage-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.fp-src{color:var(--ink2);font-size:11.5px}
.fp-src b{color:var(--ink)}
.fp-btn{display:inline-flex;align-items:center;gap:8px;background:#1877f2;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:11.5px;transition:background .15s}
.fp-btn:hover{background:#0f65d8}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;min-width:130px}
.stat .n{font-family:"Be Vietnam Pro",sans-serif;font-size:23.8px;font-weight:700;line-height:1}
.stat .l{font-size:10.2px;color:var(--ink2);font-weight:600}

/* ---------- toolbar ---------- */
.searchbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:12px 0 10px;margin-top:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search svg{flex:none;color:var(--ink3)}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;width:100%}
.search input::placeholder{color:var(--ink3)}
.search .clear{border:0;background:var(--chip);color:var(--ink2);border-radius:8px;padding:4px 10px;font-size:10.6px;font-weight:700;display:none}
.search-wrap{position:relative}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:45;display:none;max-height:344px;overflow-y:auto}
.suggest.open{display:block;animation:fadeIn .15s ease}
.sg-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:none;border:0;text-align:left;color:var(--ink);font:inherit}
.sg-item + .sg-item{border-top:1px solid var(--surface2)}
.sg-item img{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.sg-item .sg-name{font-weight:700;font-size:11.9px}
.sg-item .cnt{margin-left:auto;color:var(--ink3);font-size:10.2px;font-weight:700;white-space:nowrap}
.sg-item.active,.sg-item:hover{background:var(--surface2)}
.sg-head{padding:9px 12px 3px;font-size:9.3px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sg-code{flex:none;font-weight:800;font-size:11px;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 8px;min-width:38px;text-align:center}
.sg-item .sg-sub{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 2px 4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:11.5px;display:inline-flex;gap:7px;align-items:center}
.tab .cnt{font-size:9.8px;background:var(--chip);border-radius:999px;padding:1px 8px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .cnt{background:rgba(127,127,127,.25);color:inherit}
.tab .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tab .tab-ic{width:18px;height:18px;border-radius:5px;flex:none;object-fit:cover;display:block}

/* ---------- group sections / cards ---------- */
.group-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px}
.group-head h2{font-size:18.7px;margin:0;font-weight:800}
.group-head .gcount{color:var(--ink3);font-weight:700;font-size:11px}
.group-head .grule{flex:1;height:1px;background:var(--line);align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;width:100%;color:var(--ink);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.code{font-family:"Be Vietnam Pro",sans-serif;font-weight:800;font-size:16.1px;letter-spacing:.04em;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px}
.gtag{font-size:9.8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.prop-badge{display:inline-flex;align-items:center;flex:none;background:var(--prop-bg);color:var(--prop-ink);border:1.5px solid var(--prop-line);border-radius:999px;padding:2px 9px;font-size:9.8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;line-height:1.35}
.card-top .arr{margin-left:auto;color:var(--ink3);font-weight:700;font-size:11px}
.heroes{display:flex;gap:10px}
.hero{flex:1;min-width:0;text-align:center}
.hero img{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1px solid var(--line);object-fit:cover}
.hero .hn{font-size:9.8px;font-weight:600;color:var(--ink2);margin-top:5px;line-height:1.3;overflow-wrap:anywhere}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);flex-wrap:wrap}
.fmt{font-size:10.6px;font-weight:700;background:var(--chip);border-radius:8px;padding:4px 9px}
.fmt-sq{display:inline-flex;flex-direction:column;gap:2px;vertical-align:middle;background:var(--chip);border-radius:8px;padding:5px 8px}
.fsq-cols{display:flex;gap:5px}
.formation-box .fmt-sq{background:var(--surface2)}
.fsq-col{position:relative;width:12px;flex:none}
.fsq{position:absolute;left:0;width:12px;height:12px;border-radius:3px}
.fsq.b{background:var(--back)}
.fsq.f{background:var(--front)}
.fsq.off{background:transparent;opacity:.85}
.fsq.off.b{border:2px solid var(--back)}
.fsq.off.f{border:2px solid var(--front)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.petmini{display:inline-flex;align-items:center;gap:7px;font-size:10.6px;font-weight:700;color:var(--ink2)}
.petmini img{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface2)}
.ccount{margin-left:auto;font-size:10.6px;color:var(--gold);font-weight:800}
.empty{display:none;text-align:center;color:var(--ink2);padding:44px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);margin-top:16px}
.empty.show{display:block}

/* ---------- detail overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.62);z-index:60;display:none;overflow-y:auto;padding:18px 12px 40px}
.overlay.open{display:block}
.sheet{max-width:860px;margin:0 auto;background:var(--bg);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 18px 26px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;position:sticky;top:-1px;z-index:6;background:var(--bg);margin:-20px -18px 6px;padding:16px 18px 12px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.sheet-head h2{margin:2px 0 4px;font-size:clamp(17px,4vw,22.9px);line-height:1.25}
.closebtn{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:800}
.section-t{font-family:"Be Vietnam Pro",sans-serif;letter-spacing:.07em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;margin:22px 0 8px}
.formation-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.fmt-name{font-weight:800;font-size:13.6px;margin-bottom:10px}
.fmt-name span{color:var(--ink2);font-weight:600;font-size:11px}
.board{position:relative;display:flex;align-items:stretch;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.bgroup{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.bgroup.back{align-items:flex-end}
.bgroup.front{align-items:flex-start}
.bdiv{flex:none;width:2px;border-radius:2px;background:var(--ink3);opacity:.55;margin:0 6px}
.bhero{position:relative;flex:none;width:86px;display:flex;align-items:flex-start;justify-content:center}
.bhero.front{flex-direction:row-reverse}
.bcol{flex:none;width:78px;display:flex;flex-direction:column;align-items:center}
.bimg{position:relative;width:78px;height:78px;flex:none}
.bimg img{width:78px;height:78px;border-radius:10px;background:var(--surface);object-fit:cover}
.bhero.front .bimg img{border:3px solid var(--front-frame)}
.bhero.back .bimg img{border:3px solid var(--back-frame)}
.bhero .bimg button{padding:0;border:0;background:none;display:block;border-radius:10px}
.bhero .bimg button:focus-visible,.petfig:focus-visible,.petcol-item:focus-visible,.op-row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bhn{font-size:9.3px;font-weight:600;color:var(--ink2);margin-top:5px;line-height:1.25;text-align:center;overflow-wrap:anywhere;width:100%;min-height:24px}
.lgwrap{float:right;display:inline-flex;gap:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10.2px;font-weight:700;color:var(--ink2)}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.lg .lg-f{background:var(--front-frame)}
.lg .lg-b{background:var(--back-frame)}
.mini-open{margin-left:auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 11px;font-weight:800;font-size:10.6px;flex:none}
.bimg-ph{width:78px;height:78px;flex:none;border-radius:10px;background:transparent;opacity:.85;display:block}
.bhero.back .bimg-ph{border:2px solid var(--back-frame)}
.bhero.front .bimg-ph{border:2px solid var(--front-frame)}
.hero-ph{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:transparent;border:2px solid var(--line);opacity:.5}
.sg-ph{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);opacity:.5;flex:none;display:block}
@media (max-width:560px){.bimg,.bimg img{width:66px;height:66px}.bcol{width:66px}.bhero{width:74px}.bdiv{margin:0 4px}.board{padding:10px}.bgroup{gap:6px}.bimg-ph{width:66px;height:66px}}
.petbox{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.petbox img{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.petbox .pn{font-weight:800;font-size:13.6px}
.petbox .pe{color:var(--ink2);font-size:11.5px}
.counter-block{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 48px;margin-top:12px}
.counter-block .cb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prio{font-family:"Be Vietnam Pro",sans-serif;font-weight:800;background:var(--gold);color:#191204;border-radius:8px;padding:3px 10px;font-size:11.9px;letter-spacing:.03em}
@media (prefers-color-scheme: dark){.prio{color:#191204}}
.skills{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);counter-reset:sk}
.skills li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.skills li + li{border-top:1px solid var(--surface2)}
.sknum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.skill-txt{font-size:11.9px}
.skill-txt b{font-weight:800}
.slot{display:inline-block;font-size:9.3px;font-weight:800;border-radius:6px;padding:1px 7px;margin:0 4px;vertical-align:1px}
.slot.s1{background:#dcebfb;color:#144a86}
.slot.s2{background:#fbe3c8;color:#7a4a05}
@media (prefers-color-scheme: dark){.slot.s1{background:#173457;color:#9ec5f5}.slot.s2{background:#4a3208;color:#f5cd7e}}

/* ---------- ally / enemy cards (redesign) ---------- */
.card.def{background:var(--enemy-bg);border-color:var(--enemy-line)}
.card.def:hover{border-color:var(--danger)}
.card.ctr{background:var(--ally-bg);border:2px solid var(--ally-line);box-shadow:0 6px 18px rgba(30,90,160,.16)}
.card.ctr:hover{border-color:var(--magic)}
.counter-block.ally{background:var(--ally-bg);border:2px solid var(--ally-line);box-shadow:0 8px 22px rgba(30,90,160,.16)}
.def-block{background:var(--enemy-bg);border:1px solid var(--enemy-line);border-radius:var(--radius);padding:14px;margin-top:12px}
.def-block .cb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.team-zone{border-radius:var(--radius);padding:14px}
.team-zone.enemy{background:var(--enemy-bg);border:1px solid var(--enemy-line)}
.team-zone.ally{background:var(--ally-bg);border:2px solid var(--ally-line)}
.team-zone .formation-box,.team-zone .petbox{background:var(--surface)}
.cb-detail{position:absolute;top:auto;bottom:12px;right:12px;border:1px solid var(--ally-line);background:var(--surface);color:var(--ally-ink);border-radius:8px;padding:5px 11px;font-weight:800;font-size:10.6px;flex:none;z-index:2}
.cb-detail:hover{background:var(--ally-bg2)}
.cb-title{font-size:22px;font-weight:900;text-align:center;color:var(--ally-ink);letter-spacing:.02em;line-height:1.2;padding:0 12px}
.cb-sub{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:5px;text-align:center}
.cb-sub .code{font-size:11px;padding:1px 7px;border-radius:6px}
.cb-sub .cb-heroes{font-weight:700;color:var(--ink2)}
.cb-body{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
.cb-main{flex:1;min-width:0}
.pet-col{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2px}
.board .pet-col{padding-top:0;justify-content:center}
.board .petcol-item img{background:var(--surface)}
.pet-col .pc-t{font-size:9.3px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center}
.petcol-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;border:0;background:none;color:var(--ink);width:100%}
.petcol-item img{border-radius:9px;border:1px solid var(--line);background:var(--surface2);object-fit:cover}
.petcol-item .pcn{font-size:10.2px;font-weight:700;color:var(--ink2);line-height:1.25;text-align:center;overflow-wrap:anywhere}
.petcol-item.p1 img{width:59px;height:59px}
.petcol-item.px img{width:33px;height:33px}
.petcol-item.px{opacity:.8}
@media (max-width:560px){.petcol-item.p1 img{width:50px;height:50px}.petcol-item.px img{width:28px;height:28px}.pet-col{width:54px}.cb-title{font-size:18.7px;padding:0 8px}}
/* pet figure: image + name below, 50% of hero image */
.petfig{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink)}
.petfig img{width:39px;height:39px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);object-fit:cover}
.petfig .pfn{font-size:10.6px;font-weight:800}
.petfig .pfh{font-size:9.3px;font-weight:700;color:var(--ink3)}
@media (max-width:560px){.petfig img{width:33px;height:33px}}
/* visual opening-skill list */
.opener{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.opener-t{font-weight:800;font-size:12.8px;margin-bottom:6px}
.op-row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 4px;background:none;border:0;text-align:left;color:var(--ink);border-radius:10px}
.op-row + .op-row{border-top:1px solid var(--surface2)}
.op-row:hover{background:var(--surface2)}
.op-num{flex:none;font-weight:900;font-size:14.5px;color:var(--gold);width:30px;text-align:center}
.op-ic{flex:none;width:66px;height:66px;display:flex;align-items:center;justify-content:center}
.op-ic img{width:66px;height:66px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);object-fit:cover}
.op-txt{flex:1;min-width:0;font-size:12.8px;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap;gap:0 5px}
.op-txt b{font-weight:800}
.op-txt .op-sn{color:var(--ink2);font-weight:600}
@media (max-width:560px){.op-ic,.op-ic img{width:56px;height:56px}}
/* ---------- hero / skill / pet panels ---------- */
.poverlay{position:fixed;inset:0;background:rgba(5,7,12,.68);z-index:80;display:none;overflow-y:auto;padding:22px 12px 44px}
.poverlay.open{display:block;animation:fadeIn .18s ease}
.psheet{max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 18px 24px;animation:sheetIn .3s cubic-bezier(.2,.8,.25,1)}
.p-head{display:flex;gap:14px;align-items:center;position:sticky;top:-1px;z-index:6;background:var(--bg);margin:-20px -18px 14px;padding:16px 18px 12px;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}
.p-head img.pava{width:78px;height:78px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);object-fit:cover;flex:none}
.p-head h3{margin:0;font-size:20.4px;line-height:1.25}
.p-head .p-sub{color:var(--ink2);font-size:11.9px;font-weight:600;margin-top:3px}
.p-close{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:800}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pchip{font-size:10.2px;font-weight:800;background:var(--chip);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.pchip.ok{background:var(--tank);color:#fff}
.skill-sec{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-top:12px}
.skill-sec .ss-head{display:flex;gap:12px;align-items:center}
.skill-sec .ss-head img{width:66px;height:66px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);object-fit:cover;flex:none}
.skill-sec .ss-name{font-weight:800;font-size:13.6px;line-height:1.3}
.skill-sec .ss-slot{font-size:10.2px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.skill-sec .ss-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.skill-sec .ss-eff{color:var(--ink2);font-size:12.8px;margin-top:8px;line-height:1.55}
.ss-eff .ss-p{margin:0 0 7px}
.ss-eff .ss-p:last-child{margin-bottom:0}
.fx-damage{color:var(--fx-damage)} .fx-heal{color:var(--fx-heal)} .fx-buff{color:var(--fx-buff)}
.fx-debuff{color:var(--fx-debuff)} .fx-protection{color:var(--fx-protection)} .fx-control{color:var(--fx-control)} .fx-special{color:var(--fx-special)}
.skill-sec .ss-cond{color:var(--ink3);font-size:11.5px;margin-top:6px}
.ss-rows{margin-top:10px;display:grid;gap:4px}
.ss-row{display:flex;gap:8px;font-size:12.3px;line-height:1.45}
.ss-row .k{flex:none;width:128px;color:var(--ink3);font-weight:700}
.ss-row .v{font-weight:600;overflow-wrap:anywhere}
.ss-eff-t{font-weight:800;color:var(--ink)}
.ss-max{border:1px dashed var(--gold-line);background:var(--gold-bg);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.55}
.ss-kind{margin-left:auto;flex:none;align-self:flex-start}
.p-note{border:1px dashed var(--gold-line);background:var(--gold-bg);border-radius:12px;padding:10px 14px;color:var(--ink2);font-size:12.3px;margin-top:12px}
.p-link{display:inline-block;margin-top:14px;color:var(--gold);font-weight:700;font-size:12.3px}
.pet-big{display:flex;gap:14px;align-items:center}
.pet-big img{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.eff-table{width:100%;border-collapse:collapse;margin-top:12px}
.eff-table th,.eff-table td{border:1px solid var(--line);padding:8px 10px;font-size:12.3px;text-align:left;vertical-align:top}
.eff-table th{background:var(--surface2);font-weight:800;width:34%}
.pet-card{cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.pet-card:hover{border-color:var(--gold)}

/* ---------- info sections ---------- */
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:34px}
.info h2{margin:0 0 10px;font-size:16.1px}
.info h3{margin:18px 0 6px;font-size:13.2px}
.info p,.info li{color:var(--ink2);font-size:11.9px}
.info ul{margin:6px 0;padding-left:20px}
.info a{color:var(--gold);font-weight:600;overflow-wrap:anywhere}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.pet-card{display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pet-card img{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pet-card .pn{font-weight:800}
.pet-card .pe{font-size:10.6px;color:var(--ink2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(14px)}}
.card{animation:fadeUp .3s ease backwards}
.group-head{animation:fadeUp .3s ease backwards}
.counter-block{animation:fadeUp .38s ease backwards}
.overlay.open{animation:fadeIn .18s ease}
.overlay.open .sheet{animation:sheetIn .3s cubic-bezier(.2,.8,.25,1)}
.overlay.closing{animation:fadeOut .18s ease both}
.overlay.closing .sheet{animation:sheetOut .18s ease both}
footer{margin-top:30px;color:var(--ink3);font-size:10.6px;text-align:center}
footer .ver{display:block;margin-top:6px;font-size:8.5px;letter-spacing:.04em;opacity:.65}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .stat{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

   These — and only these — show the "Đề xuất" badge, in list cards and details. */
var PROPOSED_DEFENSE = {"T18":1,"M17":1,"T21":1,"T22":1,"T23":1,"T24":1,"P27":1,"P30":1,"P33":1,"P39":1,"P40":1,"P41":1,"M24":1,"M25":1,"M26":1,"M27":1,"T27":1,"T28":1,"DE1":1,"DE2":1,"DE3":1};

   DATA (team.skills, in display order). Teams without a chain render no

/* Visual formation diagram: Back-slot column (left) + Front-slot column (right).
   Both columns share ONE total height, FSQ_H = 64px, and every column always
   draws its template's full slot count on a 13px pitch (12px squares): lit
   squares for the heroes in that row plus outline squares for the empty
   slots — outlines are never dropped. The lit squares form one contiguous
   group centered on the shared mid-height; outline squares extend the lit
   group's own lattice outward, above first, then below. With FSQ_H = 64 a
   4-slot column holding 3 heroes centers exactly (lit tops 13/26/39,
   outline at 0, last outline slot ends at 64), so no off-center fallback
   occurs; the full-lattice fallback below is kept only as a safety net.
   Visible "Sau"/"Truoc" labels sit under the columns in board order
   (Back left, Front right), and the title/aria text carries the per-row
   hero counts, including empty-row notes. */
var TEMPLATES = {"Defense (4-1)": [4, 1], "Attack (1-4)": [1, 4], "Basic (2-3)": [2, 3], "Balanced (3-2)": [3, 2]};
var FSQ_H = 64, FSQ_PITCH = 13, FSQ_SIZE = 12;
function formationSquares(team){
  var name = fmtShort(team);
  if (!team.front || !team.back) return '<span class="fmt">' + esc(name) + '</span>';
  var cap = TEMPLATES[name] || [team.front.length, team.back.length];
  function col(capN, filled, cls){
    var cells = []; /* {top, lit} */
    var i, t;
    if (filled <= 0){
      var blockTop = (FSQ_H - (capN * FSQ_PITCH - (FSQ_PITCH - FSQ_SIZE))) / 2;
      for (i = 0; i < capN; i++) cells.push({top: blockTop + i * FSQ_PITCH, lit: false});
    } else {
      var fillTop = (FSQ_H - (filled * FSQ_PITCH - (FSQ_PITCH - FSQ_SIZE))) / 2;
      var need = capN - filled;
      var above = [], below = [];
      for (t = fillTop - FSQ_PITCH; t >= 0; t -= FSQ_PITCH) above.push(t);
      for (t = fillTop + filled * FSQ_PITCH; t + FSQ_SIZE <= FSQ_H; t += FSQ_PITCH) below.push(t);
      var offs = [], ai = 0, bi = 0;
      while (offs.length < need && (ai < above.length || bi < below.length)){
        if (ai < above.length){ offs.push(above[ai]); ai++; }
        if (offs.length < need && bi < below.length){ offs.push(below[bi]); bi++; }
      }
      if (offs.length < need){
        var stackTop = (FSQ_H - (capN * FSQ_PITCH - (FSQ_PITCH - FSQ_SIZE))) / 2;
        for (i = 0; i < capN; i++) cells.push({top: stackTop + i * FSQ_PITCH, lit: i >= need});
      } else {
        for (i = 0; i < offs.length; i++) cells.push({top: offs[i], lit: false});
        for (i = 0; i < filled; i++) cells.push({top: fillTop + i * FSQ_PITCH, lit: true});
      }
    }
    cells.sort(function(a, b){ return a.top - b.top; });
    var s = "";
    for (i = 0; i < cells.length; i++){
      s += '<span class="fsq ' + cls + (cells[i].lit ? '' : ' off') + '" style="top:' + cells[i].top + 'px"></span>';
    }
    return '<span class="fsq-col" style="height:' + FSQ_H + 'px">' + s + '</span>';
  }
  var counts = 'Trước ' + team.front.length + ', Sau ' + team.back.length
    + (team.back.length === 0 ? ' (hàng Sau trống)' : '')
    + (team.front.length === 0 ? ' (hàng Trước trống)' : '');
  return '<span class="fmt-sq" role="img" title="' + esc(name) + ' — ' + counts + '" aria-label="Đội hình ' + esc(name) + ' — ' + counts + '">'
    + '<span class="fsq-cols">' + col(cap[1], team.back.length, "b") + col(cap[0], team.front.length, "f") + '</span>'
    + '<span class="sr-only">' + esc(name) + ' — ' + counts + '</span></span>';
}

    var img = '<img src="'+heroImg(h)+'" alt="'+esc(h.name)+'" />';
    if (clickable) img = '<button type="button" data-hero-panel="'+esc(h.name)+'" aria-label="Xem skill của '+esc(h.name)+'" style="padding:0;border:0;background:none;display:block;width:100%">'+img+'</button>';

function matches(team, isCounter){
  if (!state.q) return true;
  var q = state.q.toLowerCase();
  var hay = (team.code + " " + team.pet + " " + (team.petBackup || []).join(" ") + " " + team.heroes.map(function(h){return h.name;}).join(" ")).toLowerCase();
  if (isCounter) hay += " " + DATA.counters[team.code].skills.map(function(s){return (s.hero||"")+" "+(s.name||"");}).join(" ").toLowerCase()
    + " " + (COUNTER_PETS[team.code] || []).join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function render(){
  var list = document.getElementById("list");
  var html = "", any = false;
  if (state.tab === "counters"){
    var cs = Object.keys(DATA.counters).filter(function(c){ return matches(DATA.counters[c], true); });
    if (cs.length){
      any = true;
      html += '<div class="group-head"><h2>Thư viện đội hình khắc chế</h2><span class="gcount">'+cs.length+' đội hình</span><span class="grule"></span></div>'
        + '<div class="grid">' + cs.map(function(c, i){ return counterCardHTML(c, i); }).join("") + '</div>';
    }
  } else {
    GROUPS.forEach(function(g){
      if (state.tab !== "all" && state.tab !== g.id) return;
      var teams = DATA.defense.filter(function(d){ return d.group===g.id && matches(d,false); });
      if (!teams.length) return;
      any = true;
      html += '<div class="group-head"><h2 style="color:'+g.color+'">'+g.label+'</h2><span class="gcount">'+teams.length+' biến thể</span><span class="grule"></span></div>'
        + '<div class="grid">' + teams.map(function(d, i){ return cardHTML(d, i); }).join("") + '</div>';
    });
    if (state.q && state.tab === "all"){
      var cs2 = Object.keys(DATA.counters).filter(function(c){ return matches(DATA.counters[c], true); });
      if (cs2.length){
        any = true;
        html += '<div class="group-head"><h2 style="color:var(--gold)">Đội hình khắc chế</h2><span class="gcount">'+cs2.length+' đội hình khớp tìm kiếm</span><span class="grule"></span></div>'
          + '<div class="grid">' + cs2.map(function(c, i){ return counterCardHTML(c, i); }).join("") + '</div>';
      }
    }
  }
  list.innerHTML = html;
  document.getElementById("empty").className = "empty" + (any ? "" : " show");
  list.querySelectorAll("[data-team]").forEach(function(b){ b.addEventListener("click", function(){ openTeam(b.getAttribute("data-team")); }); });
  list.querySelectorAll("[data-counter]").forEach(function(b){ b.addEventListener("click", function(){ openCounter(b.getAttribute("data-counter")); }); });
}

  var cell = h.img
    ? '<span class="bimg"><button type="button" data-hero-panel="' + esc(h.name) + '" aria-label="Xem skill của ' + esc(h.name) + '"><img src="' + heroImg(h) + '" alt="' + esc(h.name) + '" /></button></span>'
    : '<span class="bimg"><span class="bimg-ph" aria-hidden="true"></span></span>';
  return '<div class="bhero ' + side + '"><span class="bcol">' + cell + '<span class="bhn">' + esc(h.name) + '</span></span></div>';

function formationBoardHTML(team, petsHTML){
  if (!team.front || !team.back) return "";
  var byName = {}; team.heroes.forEach(function(h){ byName[h.name] = h; });
  var cap = TEMPLATES[fmtShort(team)] || null;
  function ghosts(n, side){
    var s = "";
    for (var i = 0; i < n; i++) s += '<div class="bhero ' + side + '" aria-hidden="true"><span class="bcol"><span class="bimg-ph"></span><span class="bhn">&nbsp;</span></span></div>';
    return s;
  }
  function grp(names, side, capN){
    var heroes = names.map(function(n){ var h = byName[n]; return h ? boardHeroHTML(h, side) : ""; }).join("");
    if (capN == null) return heroes;
    var g = Math.max(0, capN - names.length);
    var above = Math.floor(g / 2), below = g - above;
    return ghosts(above, side) + heroes + ghosts(below, side);
  }
  return '<div class="formation-box"><div class="fmt-name">' + formationSquares(team)
    + '<span class="lgwrap"><span class="lg"><i class="lg-b"></i>Back</span><span class="lg"><i class="lg-f"></i>Front</span></span></div>'
    + '<div class="board">'
    + '<div class="bgroup back">' + grp(team.back, "back", cap ? cap[1] : null) + '</div>'
    + '<div class="bdiv"></div>'
    + '<div class="bgroup front">' + grp(team.front, "front", cap ? cap[0] : null) + '</div>'
    + (petsHTML ? '<div class="bdiv"></div>' + petsHTML : '')
    + '</div></div>';
}

function openSheet(html){
  document.getElementById("sheet").innerHTML = html;
  var ov = document.getElementById("overlay");
  ov.classList.remove("closing");
  ov.classList.add("open"); ov.scrollTop = 0;
  document.body.style.overflow = "hidden";
  var cb = document.getElementById("closebtn");
  if (cb) cb.addEventListener("click", closeSheet);
  document.querySelectorAll("#sheet [data-team]").forEach(function(b){ b.addEventListener("click", function(){ openTeam(b.getAttribute("data-team")); }); });
  document.querySelectorAll("#sheet [data-counter-open]").forEach(function(b){ b.addEventListener("click", function(){ openCounter(b.getAttribute("data-counter-open")); }); });
}
function closeSheet(){
  var ov = document.getElementById("overlay");
  if (!ov.classList.contains("open") || ov.classList.contains("closing")) return;
  ov.classList.add("closing");
  document.body.style.overflow = "";
  setTimeout(function(){ ov.classList.remove("open"); ov.classList.remove("closing"); }, 180);
}

    kind = '<span class="pchip ss-kind">' + (sec.kind === "passive" ? "Bị động · tự kích hoạt" : "Chủ động") + '</span>';
  var h = '<div class="skill-sec"><div class="ss-head">' + ic + '<div><div class="ss-slot">' + esc(slotLabel) + '</div><div class="ss-name">' + esc(sec.n) + '</div></div>' + kind + '</div>';
  var rows = "";

  else if (slotLabel === "Passive") rows += secRow("Hồi chiêu", "—");

  rows += secRow("Loại sát thương", sec.dt ? (sec.dt === "none" ? "Không gây sát thương" : esc(sec.dt)) : "—");

  if (!d) return "";
  var g = groupOf(d.group);
  return '<div class="def-block"><div class="cb-head"><span class="code">'+d.code+'</span><span class="gtag" style="color:'+g.color+'">'+g.label+' · Phòng thủ</span>'+defPropBadge(d.code)
    + '<button type="button" class="mini-open" data-team="'+d.code+'">Xem chi tiết ›</button></div>'
    + '<div style="margin-top:12px">'+formationBoardHTML(d)+'</div>'
    + '<div style="margin-top:12px">'+petFigureHTML(d)+'</div></div>';
}
function openCounter(code){
  var v = DATA.counters[code]; if (!v) return;
  var beats = (beatsMap[code]||[]).map(function(t){ return defenseMiniHTML(t); }).join("");
  var zone = v.front
    ? formationBoardHTML(v, petColHTML(code))
    : '<div class="cb-body"><div class="cb-main">' + heroesHTML(v, true) + '</div>' + petColHTML(code) + '</div>';
  openSheet(
    '<div class="sheet-head"><div><span class="code">'+code+'</span> <span class="gtag" style="color:var(--gold)">Đội hình khắc chế</span> '+ctrPropBadge(code)
    + '<h2>'+v.heroes.map(function(h){return esc(h.name);}).join(" · ")+'</h2></div>'
    + '<button class="closebtn" id="closebtn" type="button">✕ Đóng</button></div>'
    + '<div class="team-zone ally">' + zone
    + '<div class="section-t">'+v.skills.length+' skill mở đầu theo thứ tự</div>' + openerHTML(v.skills)
    + '</div>'
    + (beats ? '<div class="section-t">Đội hình phòng thủ bị khắc chế</div>' + beats : "")
  );
}

/* tabs */
(function(){
  var tabs = document.getElementById("tabs");
  var defs = [{id:"all", label:"Tất cả", cnt: DATA.defense.length}].concat(
    GROUPS.filter(function(g){ return DATA.defense.some(function(d){return d.group===g.id;}); }).map(function(g){ return {id:g.id, label:g.label, color:g.color, icon:TAB_ICONS[g.id] || null, cnt: DATA.defense.filter(function(d){return d.group===g.id;}).length}; })
  ).concat([{id:"counters", label:"Thư viện khắc chế", cnt: Object.keys(DATA.counters).length}]);
  tabs.innerHTML = defs.map(function(t){
    return '<button class="tab" type="button" role="tab" data-tab="'+t.id+'" aria-selected="'+(state.tab===t.id)+'">'
      + (t.icon ? '<img class="tab-ic" src="'+t.icon+'" alt="" />' : (t.color ? '<span class="dot" style="background:'+t.color+'"></span>' : '')) + t.label + '<span class="cnt">'+t.cnt+'</span></button>';
  }).join("");
  tabs.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click", function(){
      state.tab = b.getAttribute("data-tab");
      tabs.querySelectorAll("[data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x===b ? "true" : "false"); });
      render();
    });
  });
})();

/* pet grid */
document.getElementById("petgrid").innerHTML = Object.keys(PETS).map(function(name){
  var p = PETS[name];
  var used = DATA.defense.filter(function(d){return d.pet===name;}).length + Object.keys(COUNTER_PETS).filter(function(c){return COUNTER_PETS[c].indexOf(name)!==-1;}).length;
  return '<button type="button" class="pet-card" data-pet-panel="'+name+'"><img src="'+petImg(name)+'" alt="Pet '+name+'" /><div><div class="pn">'+name+'</div>'+(p.effect ? '<div class="pe">'+esc(p.effect)+'</div>' : '')+'<div class="pe">Dùng trong '+used+' đội hình</div></div></button>';
}).join("");

/* search + suggestions: heroes first, then pets, then team codes (query >= 2 chars) */
var HEROES = (function(){
  var m = {};
  function add(h, kind){ var e = m[h.name] || (m[h.name] = {name: h.name, img: h.img, def: 0, ctr: 0}); e[kind]++; }
  DATA.defense.forEach(function(d){ d.heroes.forEach(function(h){ add(h, "def"); }); });
  Object.keys(DATA.counters).forEach(function(c){ DATA.counters[c].heroes.forEach(function(h){ add(h, "ctr"); }); });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return a.name.localeCompare(b.name); });
})();
var PET_SUGGEST = Object.keys(PETS).map(function(name){
  var used = DATA.defense.filter(function(d){ return d.pet === name; }).length
    + Object.keys(COUNTER_PETS).filter(function(c){ return COUNTER_PETS[c].indexOf(name) !== -1; }).length;
  return {name: name, used: used};
}).sort(function(a, b){ return a.name.localeCompare(b.name); });
var CODE_SUGGEST = DATA.defense.map(function(d){
  return {code: d.code, kind: "def", label: groupOf(d.group).label + " · Phòng thủ",
    heroes: d.heroes.map(function(h){ return h.name; }).join(", ")};
}).concat(Object.keys(DATA.counters).map(function(c){
  var v = DATA.counters[c];
  return {code: c, kind: "ctr", label: "Đội hình khắc chế",
    heroes: v.heroes.map(function(h){ return h.name; }).join(", ")};
}));
var qInput = document.getElementById("q");
var sgBox = document.getElementById("suggest");
var sgIndex = -1;
function hideSuggest(){ sgBox.classList.remove("open"); sgBox.innerHTML = ""; sgIndex = -1; }
function showSuggest(){
  var q = qInput.value.trim().toLowerCase();
  if (q.length < 2){ hideSuggest(); return; }
  var room = 12;
  var heroes = HEROES.filter(function(h){ return h.name.toLowerCase().indexOf(q) !== -1; }).slice(0, Math.min(8, room));
  room -= heroes.length;
  var pets = room > 0 ? PET_SUGGEST.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1; }).slice(0, room) : [];
  room -= pets.length;
  var codes = room > 0 ? CODE_SUGGEST.filter(function(t){ return t.code.toLowerCase().indexOf(q) !== -1; }).slice(0, room) : [];
  if (!heroes.length && !pets.length && !codes.length){ hideSuggest(); return; }
  sgIndex = -1;
  var html = "";
  if (heroes.length){
    html += '<div class="sg-head">Tướng</div>' + heroes.map(function(h){
      return '<button type="button" class="sg-item" role="option" data-kind="hero" data-value="' + esc(h.name) + '">' + (h.img ? '<img src="' + heroImg(h) + '" alt="" />' : '<span class="sg-ph" aria-hidden="true"></span>') + '<span class="sg-name">' + esc(h.name) + '</span><span class="cnt">' + h.def + ' thủ · ' + h.ctr + ' khắc chế</span></button>';
    }).join("");
  }
  if (pets.length){
    html += '<div class="sg-head">Pet</div>' + pets.map(function(p){
      return '<button type="button" class="sg-item" role="option" data-kind="pet" data-value="' + esc(p.name) + '"><img src="' + petImg(p.name) + '" alt="" /><span class="sg-name">' + esc(p.name) + '</span><span class="cnt">dùng trong ' + p.used + ' đội hình</span></button>';
    }).join("");
  }
  if (codes.length){
    html += '<div class="sg-head">Mã team</div>' + codes.map(function(t){
      return '<button type="button" class="sg-item" role="option" data-kind="' + t.kind + '" data-value="' + t.code + '"><span class="sg-code">' + t.code + '</span><span class="sg-sub">' + esc(t.heroes) + '</span><span class="cnt">' + esc(t.label) + '</span></button>';
    }).join("");
  }
  sgBox.innerHTML = html;
  sgBox.classList.add("open");
  sgBox.querySelectorAll(".sg-item").forEach(function(b){
    b.addEventListener("mousedown", function(e){ e.preventDefault(); pickSuggest(b.getAttribute("data-kind"), b.getAttribute("data-value")); });
  });
}
function setTabAll(){
  state.tab = "all";
  document.querySelectorAll("#tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x.getAttribute("data-tab") === "all" ? "true" : "false"); });
}
function pickHero(name){
  qInput.value = name; state.q = name;
  document.getElementById("qclear").style.display = "block";
  setTabAll(); hideSuggest(); render();
}
function pickSuggest(kind, value){
  if (kind === "hero"){ pickHero(value); return; }
  if (kind === "pet"){
    qInput.value = value; state.q = value;
    document.getElementById("qclear").style.display = "block";
    setTabAll(); hideSuggest(); render(); return;
  }
  hideSuggest();
  if (kind === "def") openTeam(value); else openCounter(value);
}
qInput.addEventListener("input", function(){
  state.q = qInput.value.trim();
  document.getElementById("qclear").style.display = state.q ? "block" : "none";
  render();
  showSuggest();
});
qInput.addEventListener("focus", showSuggest);
qInput.addEventListener("blur", function(){ setTimeout(hideSuggest, 120); });
qInput.addEventListener("keydown", function(e){
  var items = sgBox.querySelectorAll(".sg-item");
  if (!sgBox.classList.contains("open") || !items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    sgIndex = e.key === "ArrowDown" ? Math.min(sgIndex + 1, items.length - 1) : Math.max(sgIndex - 1, 0);
    items.forEach(function(it, i){ it.classList.toggle("active", i === sgIndex); });
  } else if (e.key === "Enter" && sgIndex >= 0 && items[sgIndex]){
    e.preventDefault(); pickSuggest(items[sgIndex].getAttribute("data-kind"), items[sgIndex].getAttribute("data-value"));
  } else if (e.key === "Escape"){
    hideSuggest();
  }
});
document.getElementById("qclear").addEventListener("click", function(){
  qInput.value = ""; state.q = ""; this.style.display = "none"; hideSuggest(); render(); qInput.focus();
});

/* overlay close */
document.getElementById("overlay").addEventListener("click", function(e){ if (e.target === this) closeSheet(); });
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (document.getElementById("poverlay").classList.contains("open")) closePanel(); else closeSheet();
});

render();
</script>
</body>
</html>
